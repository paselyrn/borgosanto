const PL=()=>desk()?380:0,PR=()=>desk()&&sel?480:0;
const OFF={jenner:[-10,-62],museo:[-24,66],romana:[64,62],hill:[56,-60]};
const pins={};
for(const s of SITES){const p=document.createElement('button');p.type='button';p.className='pin s-'+s.st;p.dataset.site=s.id;p.setAttribute('aria-label','Apri '+s.name);ov.appendChild(p);pins[s.id]=p}
const warns=[],byB={};
NEAR.forEach(n=>(byB[n.b.id]=byB[n.b.id]||[]).push(n));
for(const list of Object.values(byB))list.forEach((n,i)=>{const w=document.createElement('span');w.className='warn w-'+n.o.st;w.innerHTML=tri();w.dataset.u=n.u;ov.appendChild(w);warns.push({w,n,dx:(i-(list.length-1)/2)*17,dy:n.b.site?14:0})});
function val(s){
 if(metric==='prog')return{v:s.done+'%',sub:'piano '+s.plan+'%',cls:s.done<s.plan?'bad':'good'};
 if(metric==='bud')return{v:pc(s.dev),sub:eurK(s.E)+' su '+eurK(s.B),cls:s.dev>0?'bad':'good'};
 if(metric==='rar')return{v:s.rar==null?'—':eur(s.rar),sub:s.rar==null?'nessuna chiave':'a settimana di ritardo',cls:''};
 return{v:gg(s.delay),sub:'consegna '+fd(s.fc,1),cls:s.delay>0?'bad':'good'};
}
function place(){
 const sc=desk()?1:.75,W=map.clientWidth,H=map.clientHeight,P=[];let L='';
 for(const s of SITES){
  const ax=view.x+s.c[0]*view.k,ay=view.y+s.c[1]*view.k,o=OFF[s.id],p=pins[s.id];
  const vis=ax>PL()-6&&ax<W-PR()+6&&ay>-6&&ay<H+6;p.style.display=vis?'':'none';if(!vis)continue;
  p.innerHTML=`<i class="dot"></i><b>${esc(s.name)}</b><em class="num">${val(s).v}</em>`;
  const hw=p.offsetWidth/2,hh=p.offsetHeight/2;
  P.push({s,p,ax,ay,hw,hh,x:Math.max(PL()+hw+8,Math.min(W-PR()-hw-8,ax+o[0]*sc)),y:Math.max(hh+8,Math.min(H-hh-8,ay+o[1]*sc))});
 }
 // on small maps the labels can collide: push overlapping pairs apart vertically
 for(let it=0;it<8;it++){let moved=false;
  for(let i=0;i<P.length;i++)for(let j=i+1;j<P.length;j++){const a=P[i],b=P[j];
   const ox=a.hw+b.hw+6-Math.abs(a.x-b.x),oy=a.hh+b.hh+6-Math.abs(a.y-b.y);if(ox<=0||oy<=0)continue;
   const d=(a.y<=b.y?1:-1)*oy/2;a.y-=d;b.y+=d;moved=true}
  for(const q of P)q.y=Math.max(q.hh+8,Math.min(H-q.hh-8,q.y));
  if(!moved)break}
 for(const {s,p,ax,ay,x,y} of P){
  p.style.left=x+'px';p.style.top=y+'px';p.classList.toggle('sel',sel===s.id);
  L+=`<line class="lead" x1="${ax}" y1="${ay}" x2="${x}" y2="${y}"/><circle class="anchor s-${s.st}" cx="${ax}" cy="${ay}" r="4"/>`;
 }
 leads.innerHTML=L;
 for(const it of warns){const c=it.n.b.c;it.w.style.left=(view.x+c[0]*view.k+it.dx)+'px';it.w.style.top=(view.y+c[1]*view.k+it.dy)+'px'}
 const want=80/view.k*GEO.mpx,nice=[5,10,20,25,50,100,200].find(v=>v>=want)||200,sc2=document.getElementById('scale');
 sc2.querySelector('span').textContent=nice+' m';sc2.querySelector('i').style.width=(nice/GEO.mpx*view.k)+'px';
}
function apply(){world.setAttribute('transform',`translate(${view.x} ${view.y}) scale(${view.k})`);place()}
function fit(){
 const r=map.getBoundingClientRect(),pad=desk()?{l:400,r:sel?500:90,t:60,b:60}:{l:28,r:28,t:56,b:44};
 const pts=GEO.bs.filter(b=>b.id!=='garage').flatMap(b=>b.pts),xs=pts.map(p=>p[0]),ys=pts.map(p=>p[1]);
 const x0=Math.min(...xs)-24,x1=Math.max(...xs)+24,y0=Math.min(...ys)-24,y1=Math.max(...ys)+24;
 const W=Math.max(120,r.width-pad.l-pad.r),H=Math.max(120,r.height-pad.t-pad.b),k=Math.min(W/(x1-x0),H/(y1-y0));fitK=k;
 view={k,x:pad.l+(W-(x1-x0)*k)/2-x0*k,y:pad.t+(H-(y1-y0)*k)/2-y0*k};apply();
}
function zoomAt(f,cx,cy){const k=Math.max(fitK*.5,Math.min(fitK*6,view.k*f));f=k/view.k;view.x=cx-(cx-view.x)*f;view.y=cy-(cy-view.y)*f;view.k=k;apply()}
let drag=null;const ptr=new Map();
map.addEventListener('pointerdown',e=>{
 if(e.target.closest('.pin,.warn,.zoom'))return;
 ptr.set(e.pointerId,{x:e.clientX,y:e.clientY});map.setPointerCapture(e.pointerId);
 if(ptr.size===1)drag={x:e.clientX,y:e.clientY,vx:view.x,vy:view.y,moved:0,t:e.target};
 else{const [a,b]=[...ptr.values()];drag={pinch:Math.hypot(a.x-b.x,a.y-b.y),k:view.k}}
});
map.addEventListener('pointermove',e=>{
 if(!ptr.has(e.pointerId)){hover(e);return}
 ptr.set(e.pointerId,{x:e.clientX,y:e.clientY});
 if(drag&&drag.pinch&&ptr.size===2){const [a,b]=[...ptr.values()],r=map.getBoundingClientRect();zoomAt(drag.k*Math.hypot(a.x-b.x,a.y-b.y)/drag.pinch/view.k,(a.x+b.x)/2-r.left,(a.y+b.y)/2-r.top);return}
 if(!drag||drag.pinch)return;
 const dx=e.clientX-drag.x,dy=e.clientY-drag.y;drag.moved=Math.max(drag.moved,Math.abs(dx)+Math.abs(dy));
 if(drag.moved>3){map.classList.add('drag');hideTip();view.x=drag.vx+dx;view.y=drag.vy+dy;apply()}
});
const up=e=>{if(!ptr.has(e.pointerId))return;ptr.delete(e.pointerId);map.classList.remove('drag');
 if(drag&&!drag.pinch&&drag.moved<=3){const t=drag.t.closest&&drag.t.closest('[data-site]');if(t)open(t.dataset.site)}drag=null};
map.addEventListener('pointerup',up);map.addEventListener('pointercancel',up);
map.addEventListener('wheel',e=>{if(e.target.closest('.zoom'))return;e.preventDefault();const r=map.getBoundingClientRect();zoomAt(Math.exp(-e.deltaY*.0016),e.clientX-r.left,e.clientY-r.top)},{passive:false});
const mid=()=>{const r=map.getBoundingClientRect();return[(PL()+r.width-PR())/2,r.height/2]};
document.getElementById('zin').onclick=()=>zoomAt(1.4,...mid());
document.getElementById('zout').onclick=()=>zoomAt(1/1.4,...mid());
document.getElementById('zfit').onclick=fit;

const tip=document.getElementById('tip');
function showTip(html,x,y){tip.innerHTML=html;tip.classList.add('on');const w=tip.offsetWidth,hh=tip.offsetHeight;tip.style.left=Math.min(innerWidth-w-8,x+14)+'px';tip.style.top=Math.max(8,y-hh-12)+'px'}
function hideTip(){tip.classList.remove('on')}
function setHot(id){
 if(hot===id)return;hot=id;
 document.querySelectorAll('.sb').forEach(p=>p.classList.toggle('hot',p.dataset.site===id||p.dataset.site===sel));
 document.querySelectorAll('.buf').forEach(p=>p.classList.toggle('on',p.dataset.buf===id||p.dataset.buf===sel));
 document.querySelectorAll('.row[data-site]').forEach(c=>c.classList.toggle('hot',c.dataset.site===id));
}
function hover(e){
 const t=e.target;
 if(t.classList&&t.classList.contains('sb')){const s=siteById[t.dataset.site];setHot(s.id);showTip(`${esc(s.name)}<small>${STL[s.st]} · apri la scheda</small>`,e.clientX,e.clientY);return}
 if(t.dataset&&t.dataset.b){const b=bldById[t.dataset.b],u=b.units.map(x=>OPS[x]).filter(Boolean);setHot(null);
  showTip(`${esc(b.name)}<small>${b.acq?'In acquisizione':u.length?u.map(o=>esc(o.n)+': '+WL[o.st]).join('<br>'):'Borgo Santo'}</small>`,e.clientX,e.clientY);return}
 setHot(null);hideTip();
}
map.addEventListener('pointerleave',()=>{setHot(null);hideTip()});
ov.addEventListener('pointerover',e=>{
 const w=e.target.closest('.warn');if(w){const n=NEAR.find(x=>x.u===w.dataset.u),f=n.near[0];
  showTip(`${esc(n.o.n)}<small>${esc(wtxt(n.o))}<br>${f.m===0?'nello stesso edificio di':'a '+f.m+' m da'} ${esc(siteById[f.site].name)}</small>`,e.clientX,e.clientY);return}
 const p=e.target.closest('.pin');if(p)setHot(p.dataset.site);
});
ov.addEventListener('pointerout',e=>{if(e.target.closest('.warn,.pin')){hideTip();setHot(null)}});
ov.addEventListener('click',e=>{const p=e.target.closest('.pin');if(p)open(p.dataset.site)});

const late=SITES.filter(s=>s.delay>0).length,totR=SITES.reduce((a,s)=>a+(s.rar||0),0);
const order={red:0,orange:1,green:2},sorted=[...SITES].sort((a,b)=>order[a.st]-order[b.st]||b.delay-a.delay);
const MET=[['del','Consegna'],['prog','Progresso'],['bud','Budget'],['rar','Ricavi']];
const panel=document.getElementById('panel');
function renderPanel(){
 panel.innerHTML=`<h1>Cantieri</h1>
<p class="finding"><b>${late} su ${SITES.length} in ritardo.</b> Ogni settimana in più costa <b class="num">${eur(totR)}</b> di ricavi.</p>
<div class="seg" role="group" aria-label="Dato mostrato">${MET.map(([k,l])=>`<button type="button" data-m="${k}" aria-pressed="${metric===k}">${l}</button>`).join('')}</div>
<div class="group">${sorted.map(s=>{const v=val(s);return `<button type="button" class="row s-${s.st}${sel===s.id?' sel':''}" data-site="${s.id}"><i class="dot"></i><span class="tx"><b>${esc(s.name)}</b><small class="num">${esc(v.sub)}</small></span><span class="val num ${v.cls}">${v.v}</span><span class="chev" aria-hidden="true">›</span></button>`}).join('')}</div>
<div class="group"><label class="switch" for="tw"><span class="w-occ">${tri()}</span><span class="tx">Camere vicine<small>${NEAR.length} camere entro ${GEO.r} m da un cantiere</small></span><input type="checkbox" id="tw" ${ov.classList.contains('hide-warn')?'':'checked'}></label></div>
<p class="fine">Dati dimostrativi · © OpenStreetMap contributors</p>`;
}
renderPanel();
panel.addEventListener('click',e=>{const m=e.target.closest('[data-m]');if(m){metric=m.dataset.m;renderPanel();place();return}const c=e.target.closest('.row[data-site]');if(c)open(c.dataset.site)});
panel.addEventListener('change',e=>{if(e.target.id==='tw')ov.classList.toggle('hide-warn',!e.target.checked)});
panel.addEventListener('pointerover',e=>{const c=e.target.closest('.row[data-site]');setHot(c?c.dataset.site:null)});
panel.addEventListener('pointerleave',()=>setHot(null));

const sheet=document.getElementById('sheet');let tab='tappe';
function tappe(s){
 const end=[...s.phases.map(p=>p[1]),...s.phases.map(p=>p[2])].sort().at(-1),t0=T(s.start),t1=T(end)+10*864e5;
 const X=d=>((T(d)-t0)/(t1-t0)*100).toFixed(2)+'%',W=(a,b)=>Math.max(.6,(T(b)-T(a))/(t1-t0)*100).toFixed(2)+'%';
 let pp=s.start,pa=s.start,rows='';
 for(const [n,p,a,st] of s.phases){
  const dl=days(p,a);
  let bars=`<span class="tl-p" style="left:${X(pp)};width:${W(pp,p)}"></span>`;
  if(st==='done')bars+=`<span class="tl-a a-done" style="left:${X(pa)};width:${W(pa,a)}"></span>`;
  else if(st==='doing')bars+=`<span class="tl-a a-now" style="left:${X(pa)};width:${W(pa,TODAY)}"></span><span class="tl-a a-fut" style="left:${X(TODAY)};width:${W(TODAY,a)}"></span>`;
  else bars+=`<span class="tl-a a-fut" style="left:${X(pa)};width:${W(pa,a)}"></span>`;
  rows+=`<div class="tl-row"><div class="tl-h"><b>${n}</b><small class="num">${fd(a)}${dl?` · <span class="${dl>0?'bad':'good'}">${gg(dl)}</span>`:''}</small></div><div class="tl-tr">${bars}<i class="tday" style="left:${X(TODAY)}"></i></div></div>`;
  pp=p;pa=a;
 }
 const tp=parseFloat(X(TODAY)),hide=v=>v?' style="visibility:hidden"':'';   // keep "Oggi" from colliding with the end labels
 return `<div class="tl">${rows}</div>
 <div class="axis num"><span${hide(tp<30)}>${fd(s.start,1)}</span><span class="oggi" style="left:${X(TODAY)}">Oggi</span><span${hide(tp>70)}>${fd(end,1)}</span></div>
 <div class="key"><span><i style="background:var(--line)"></i>Previsto</span><span><i class="a-done"></i>Fatto</span><span><i class="a-now"></i>In corso</span><span><i class="a-fut"></i>Stima</span></div>`;
}
function budget(s){
 const sc=Math.max(...s.budget.map(r=>Math.max(r[1],r[4],r[2]+r[3]))),P=v=>(v/sc*100).toFixed(2)+'%';
 return `<div class="btop"><b class="num">${eurK(s.E)}</b><span>previsti a fine lavori su ${eurK(s.B)} approvati</span></div>`+s.budget.map(([n,b,sp,im,e])=>{
  const li=b-sp-im,ex=Math.max(0,e-Math.max(b,sp+im));
  return `<div class="brow" title="Speso ${eurK(sp)} · impegnato ${eurK(im)} · budget ${eurK(b)} · previsione ${eurK(e)}"><div class="tl-h"><b>${n}</b><small class="num ${li<0?'bad':''}">${li<0?'sforato di '+eurK(-li):'libero '+eurK(li)}</small></div>
  <div class="bt"><span class="b-sp" style="left:0;width:${P(sp)}"></span><span class="b-im" style="left:${P(sp)};width:${P(im)}"></span>${ex>0?`<span class="b-ex" style="left:${P(Math.max(b,sp+im))};width:${P(ex)}"></span>`:''}<i style="left:${P(b)}"></i></div></div>`}).join('')
 +`<div class="key"><span><i class="b-sp"></i>Speso</span><span><i class="b-im"></i>Impegnato</span><span><i style="background:var(--fill)"></i>Libero</span><span><i class="b-ex"></i>Extra previsto</span></div>`;
}
const PSL={ok:'Approvato',wait:'In attesa',todo:'Da presentare'};
const permessi=s=>`<ul class="lst">${s.permits.map(p=>`<li class="k-${p.block?'block':p.st}"><span class="tx">${esc(p.n)}<small>${esc(p.e)}${p.st==='wait'?' · '+esc(p.d):''}</small></span><span class="tg">${p.block?'Blocca i lavori':PSL[p.st]}</span></li>`).join('')}</ul>`;
const rischi=s=>`<ul class="lst">${s.risks.map(r=>`<li class="p${r.p[0]}"><span class="tx">${esc(r.r)}<small>${esc(r.i)} · ${esc(r.o)}</small></span><span class="tg">${r.p}</span></li>`).join('')}</ul>`;
function renderSheet(){
 const s=siteById[sel];if(!s)return;
 const near=NEAR.map(n=>({n,f:n.near.find(x=>x.site===s.id)})).filter(x=>x.f).sort((a,b)=>a.f.m-b.f.m);
 const occ=near.filter(x=>x.n.o.st!=='free').length;
 sheet.innerHTML=`<div class="sh s-${s.st}">
 <button class="x" type="button" aria-label="Chiudi">✕</button>
 <div class="st"><i></i>${STL[s.st]}</div>
 <h2>${esc(s.name)}</h2>
 <p class="sub">${s.keys?s.units.map(u=>`${u.m2} m² ${esc(u.cat.split(',')[0])}`).join(' + '):'Spazio comune'} · dal ${fd(s.start,1)}</p>
 <p class="why">${s.why}</p>
 <div class="hero num">
  <div><b>${s.done}%</b><span>completato, piano ${s.plan}%</span><div class="mini"><span style="width:${s.done}%"></span><i style="left:${s.plan}%"></i></div></div>
  <div><b class="${s.dev>0?'bad':'good'}">${pc(s.dev)}</b><span>budget, ${eurK(s.E)} su ${eurK(s.B)}</span></div>
  <div><b>${fd(s.fc,1)}</b><span>consegna, <span style="display:inline" class="${s.delay>0?'bad':'good'}">${gg(s.delay)}</span> sul piano</span></div>
  <div><b>${s.rar==null?'—':eur(s.rar)}</b><span title="${s.keys?esc(`(${s.units.map(u=>eur(u.adr)).join(' + ')}) × ${Math.round(s.occ*100)}% × 7 notti`):''}">${s.rar==null?'nessuna chiave da vendere':'a rischio ogni settimana di ritardo'}</span></div>
 </div>
 ${near.length?`<details class="near"><summary><span class="w-${occ?'occ':'free'}">${tri()}</span>Camere vicine<em class="num">${near.length}</em></summary><ul>${near.map(({n,f})=>`<li class="w-${n.o.st}">${tri()}<span>${esc(n.o.n)} <small>${esc(wtxt(n.o))}</small></span><em class="num">${f.m===0?'stesso edificio':f.m+' m'}</em></li>`).join('')}</ul></details>`:'<hr class="hair">'}
 <div class="seg" role="group" aria-label="Sezioni">${[['tappe','Tappe'],['budget','Budget'],['permessi','Permessi'],['rischi','Rischi']].map(([k,l])=>`<button type="button" data-tab="${k}" aria-pressed="${tab===k}">${l}</button>`).join('')}</div>
 <div>${{tappe,budget,permessi,rischi}[tab](s)}</div>
 </div>`;
}
sheet.addEventListener('click',e=>{if(e.target.closest('.x')){close();return}const b=e.target.closest('[data-tab]');if(b){const o=sheet.querySelector('details.near'),wasOpen=o&&o.open;tab=b.dataset.tab;renderSheet();if(wasOpen)sheet.querySelector('details.near').open=true}});
function open(id){
 sel=id;renderSheet();sheet.classList.add('open');sheet.scrollTop=0;hot=undefined;setHot(id);renderPanel();
 if(desk()){const s=siteById[id],r=map.getBoundingClientRect(),sx=view.x+s.c[0]*view.k,lo=PL()+40,hi=r.width-PR()-40;if(sx<lo||sx>hi)view.x+=(lo+hi)/2-sx}
 apply();sheet.querySelector('.x').focus({preventScroll:true});
}
function close(){const id=sel;sel=null;sheet.classList.remove('open');hot=undefined;setHot(null);renderPanel();place();const p=pins[id];if(p&&p.style.display!=='none')p.focus({preventScroll:true})}
addEventListener('keydown',e=>{if(e.key==='Escape'&&sel)close()});
let lw=innerWidth,ready=false;
new ResizeObserver(()=>{if(!ready||Math.abs(innerWidth-lw)>40){lw=innerWidth;ready=true;fit()}else place()}).observe(map);
fit();
}
</script>
</body>
</html>
